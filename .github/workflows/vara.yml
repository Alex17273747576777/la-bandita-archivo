# LA VARA EN INTEGRACIÓN CONTINUA
# Doctrina de la casa: ninguna compuerta se aprueba por salida en cero.
# Se aprueba cuando el informe dice "fallos: NINGUNO" y ese texto queda en el registro del job.
name: vara

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # necesario para firmar sin llave con Sigstore (OIDC efímero)

# `shell: bash` hace que cada paso corra con `-eo pipefail`. Sin esto, un `herramienta | tee`
# devolvía la salida de `tee`: la prueba del servidor MCP llevaba días rota y el paso salía verde.
defaults:
  run:
    shell: bash

concurrency:
  group: vara-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compuertas:
    name: ocho compuertas + integridad + autoprueba
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Sólo preparación en una rama: en main la compuerta nunca se auto-repara.
      - name: Preparar sello para revisión remota
        id: preparar_sello
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          python3 tools/atestar.py
          echo "fecha=$(python3 tools/fecha_casa.py)" >> "$GITHUB_OUTPUT"

      - name: Entregar sello preparado
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: seal-repair
          path: |
            registry/_manifiesto-sha256.tsv
            attestations/lote-${{ steps.preparar_sello.outputs.fecha }}.json
            attestations/lote-${{ steps.preparar_sello.outputs.fecha }}.tsv
          if-no-files-found: error

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: pip install --quiet jsonschema "mcp>=2,<3"

      - name: Regresiones de integridad
        run: python3 -m unittest discover -s tests -p test_atestar_integridad.py -v

      - name: Registro al día
        run: python3 tools/registro_construir.py --verificar

      - name: Integridad del sello SHA-256
        run: python3 tools/atestar.py --verificar

      - name: La vara (informe)
        run: python3 tools/vara.py | tee /tmp/vara.txt

      - name: La vara (veredicto explícito)
        run: |
          if ! grep -q '^fallos: NINGUNO$' /tmp/vara.txt; then
            echo "::error::la vara no dice 'fallos: NINGUNO' — la línea se detiene"
            exit 1
          fi
          echo "vara aprobada: fallos NINGUNO verificado en el texto del informe"

      - name: Cada fecha, respaldada por su evidencia
        run: python3 tools/vencimiento.py --peor

      - name: Ninguna ruta movida citada por su nombre viejo
        run: python3 tools/referencias.py --peor

      - name: Tablero de tareas al día
        run: python3 tools/tareas.py --revisar

      - name: Índice de documentos generado
        run: |
          python3 tools/indice_docs.py
          git diff --exit-code -- docs/INDICE.md docs/TAREAS.md \
            || { echo "::error::docs/INDICE.md o docs/TAREAS.md no están regenerados; corré 'make libro'"; exit 1; }

      - name: Autoprueba de compuertas
        run: python3 tools/autoprueba.py | tee /tmp/autoprueba.txt

      - name: Autoprueba (veredicto explícito)
        run: |
          grep -q 'fallos: NINGUNO$' /tmp/autoprueba.txt

      - name: Servidor MCP responde
        run: python3 mcp-labandita-registro/probar.py | tee /tmp/mcp.txt

      - name: Instalar cosign con versión y código fijados
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Atestación firmada (Sigstore, sin llave)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python3 tools/atestar.py --verificar
          PISTA=$(python3 -c "import sys;sys.path.insert(0,'tools');import atestar;print(atestar.lote_actual().stem.removeprefix('lote-'))")
          cosign sign-blob --yes \
            --bundle "attestations/lote-${PISTA}.sigstore.json" \
            registry/_manifiesto-sha256.tsv
          echo "firmado: attestations/lote-${PISTA}.sigstore.json"
          echo "-Firma verificable en attestations/ (certificado efímero de esta corrida)-" >> "$GITHUB_STEP_SUMMARY"

      - name: La firma se comprueba (G14, sin llave y en frío)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          PISTA=$(python3 -c "import sys;sys.path.insert(0,'tools');import atestar;print(atestar.lote_actual().stem.removeprefix('lote-'))")
          cosign verify-blob \
            --bundle "attestations/lote-${PISTA}.sigstore.json" \
            --certificate-identity "https://github.com/Alex17273747576777/la-bandita-archivo/.github/workflows/vara.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "attestations/lote-${PISTA}.tsv"
          python3 tools/atestacion_verificar.py "attestations/lote-${PISTA}.sigstore.json" \
                  "attestations/lote-${PISTA}.tsv" | tee /tmp/firma.txt
          grep -q 'fallos: 0$' /tmp/firma.txt

      - name: Guardar la atestación firmada
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: atestacion-firmada
          path: |
            attestations/*.sigstore.json
            attestations/*.tsv
            attestations/lote-*.json
          if-no-files-found: error

      - name: Resumen
        run: |
          {
            echo "### La Bandita · vara"
            echo '```'
            tail -14 /tmp/vara.txt
            echo '```'
            echo "Sello: $(wc -l < registry/_manifiesto-sha256.tsv) archivos · commit ${GITHUB_SHA:0:8}"
          } >> "$GITHUB_STEP_SUMMARY"
